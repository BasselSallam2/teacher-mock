<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Class Lessons - Xplain AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app-shell"></div>
<template id="page-template">
  <main class="flex-1 p-4 md:p-16 overflow-y-auto">
    <div class="max-w-3xl mx-auto space-y-6 pb-12" id="class-detail">
      <p class="text-on-surface-variant">Loading…</p>
    </div>
  </main>
</template>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script>
  XplainLayout.init({ active: "classes", search: false });

  const classId = new URLSearchParams(location.search).get("id");
  const cls = classId ? XplainStore.getClass(classId) : null;
  const root = document.getElementById("class-detail");

  function lessonHref(l) {
    if (l.status === "ready") return "workspace.html?lesson=" + l.id;
    if (l.session_id) return "workspace.html?id=" + l.session_id;
    return "lessons.html";
  }

  if (!cls) {
    root.innerHTML = `<p class="text-on-surface-variant">Class not found. <a href="classes.html" class="text-primary underline">Back to classes</a></p>`;
  } else {
    document.title = cls.name + " — Lessons · Xplain AI";
    const lessons = XplainStore.getLessonsForClass(cls.id);
    root.innerHTML = `
<a href="classes.html" class="inline-flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary mb-2">
  <span class="material-symbols-outlined text-[18px]">arrow_back</span> All classes
</a>
<div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
  <div>
    <div class="h-1.5 w-16 rounded-full mb-3" style="background:${cls.accent}"></div>
    <span class="inline-block px-2 py-1 bg-surface-container-high text-on-surface-variant text-xs rounded mb-2">${XplainUI.escapeHtml(cls.grade)}</span>
    <h1 class="text-3xl font-semibold text-on-surface">${XplainUI.escapeHtml(cls.name)}</h1>
    <p class="text-on-surface-variant mt-1">${XplainUI.escapeHtml(cls.curriculum)} · ${lessons.length} lesson${lessons.length === 1 ? "" : "s"}</p>
    ${cls.description ? `<p class="text-sm text-on-surface-variant mt-3 max-w-xl">${XplainUI.escapeHtml(cls.description)}</p>` : ""}
  </div>
  <a href="workspace.html?new=1" class="inline-flex items-center gap-2 px-4 py-2.5 bg-primary-container text-on-primary-container rounded-lg text-sm shrink-0">
    <span class="material-symbols-outlined text-sm">add</span> New lesson
  </a>
</div>

<div class="relative">
  <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
  <input id="lesson-search" type="search" placeholder="Search lessons in this class…" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-surface-container border-none focus:ring-2 focus:ring-primary-container text-sm"/>
</div>

<div id="lesson-list" class="bg-surface border border-outline-variant rounded-xl overflow-hidden divide-y divide-outline-variant/30"></div>
`;

    function renderList() {
      const q = (document.getElementById("lesson-search").value || "").toLowerCase();
      const filtered = lessons.filter((l) => !q || l.title.toLowerCase().includes(q));
      const box = document.getElementById("lesson-list");
      if (!filtered.length) {
        box.innerHTML = `<p class="p-8 text-center text-sm text-on-surface-variant">${lessons.length ? "No lessons match your search." : "No lessons in this class yet."}</p>`;
        return;
      }
      box.innerHTML = filtered
        .map(
          (l) => `
<a href="${lessonHref(l)}" class="flex items-center gap-4 px-4 py-4 hover:bg-surface-container-low transition-colors">
  <div class="w-11 h-11 rounded-lg bg-primary-container/20 text-primary flex items-center justify-center shrink-0">
    <span class="material-symbols-outlined">${l.icon || "menu_book"}</span>
  </div>
  <div class="flex-1 min-w-0">
    <p class="font-medium text-on-surface truncate">${XplainUI.escapeHtml(l.title)}</p>
    <p class="text-xs text-on-surface-variant mt-0.5">${XplainUI.relativeTime(l.updated_at)}${l.error ? " · " + XplainUI.escapeHtml(l.error) : ""}</p>
  </div>
  ${XplainUI.statusChip(l.status)}
  <span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</a>`
        )
        .join("");
    }

    document.getElementById("lesson-search").addEventListener("input", renderList);
    renderList();
  }
</script>
</body>
</html>
