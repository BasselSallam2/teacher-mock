<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lesson Workspace - Xplain AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body class="h-screen overflow-hidden">
<div id="app-shell"></div>
<template id="page-template">
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative min-h-0">
    <section id="chat-panel" class="w-full md:w-[min(36%,400px)] xl:w-[420px] shrink-0 border-r border-outline-variant bg-surface flex flex-col h-full min-h-0 z-10 transition-[width] duration-200" dir="ltr">
      <header class="px-3.5 py-2.5 border-b border-outline-variant/80 bg-surface flex items-center justify-between shrink-0 gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-7 h-7 rounded-md bg-primary-container flex items-center justify-center text-on-primary-container shrink-0">
            <span class="material-symbols-outlined text-[16px]">smart_toy</span>
          </div>
          <div class="min-w-0">
            <h3 class="font-semibold text-[13px] text-on-surface truncate leading-tight">Xplain AI Agent</h3>
            <span class="text-[10px] text-secondary flex items-center gap-1"><span class="w-1 h-1 rounded-full bg-secondary"></span> Ready</span>
          </div>
        </div>
        <div class="flex items-center gap-0.5 shrink-0">
          <button type="button" id="toggle-preview" class="text-on-surface-variant hover:bg-surface-container hover:text-on-surface rounded-md p-1.5 transition-colors" title="Hide preview">
            <span class="material-symbols-outlined text-[18px]" id="toggle-preview-icon">right_panel_close</span>
          </button>
          <a href="index.html" class="text-on-surface-variant hover:bg-surface-container hover:text-on-surface rounded-md p-1.5 transition-colors" title="Home">
            <span class="material-symbols-outlined text-[18px]">home</span>
          </a>
        </div>
      </header>
      <div id="chat-messages" class="flex-1 overflow-y-auto px-3.5 py-3 space-y-3 min-h-0 scroll-smooth" dir="ltr"></div>
      <div id="section-chips" class="px-3.5 pt-1 flex flex-wrap gap-1 empty:hidden shrink-0"></div>
      <div class="px-3 py-2.5 bg-surface border-t border-outline-variant/80 shrink-0 relative">
        <div id="mention-menu" class="hidden absolute bottom-full left-3 right-3 mb-1.5 bg-surface border border-outline-variant rounded-lg shadow-lg mention-menu z-20 overflow-hidden"></div>
        <div class="relative flex items-end gap-0.5 bg-surface border border-outline-variant rounded-lg focus-within:border-primary focus-within:ring-1 focus-within:ring-primary/20">
          <button type="button" id="attach-btn" class="p-2 text-on-surface-variant hover:text-primary shrink-0" title="@ mention">
            <span class="material-symbols-outlined text-[18px]">alternate_email</span>
          </button>
          <textarea id="chat-input" rows="1" class="w-full bg-transparent border-none focus:ring-0 text-[13px] leading-5 py-2 px-0.5 resize-none max-h-24 min-h-[36px]" placeholder="Message or @mention…" autocomplete="off" dir="ltr"></textarea>
          <button type="button" id="chat-send" class="p-1.5 bg-primary text-on-primary rounded-md m-1 hover:opacity-90 shrink-0">
            <span class="material-symbols-outlined text-[16px]">send</span>
          </button>
        </div>
      </div>
    </section>
    <section id="preview-panel" class="flex-1 bg-surface-container-lowest h-full overflow-y-auto relative flex flex-col min-h-0 min-w-0 transition-all duration-200">
      <div id="right-pane" class="flex-1 flex flex-col min-h-0"></div>
    </section>
    <button type="button" id="reopen-preview" class="hidden fixed top-1/2 right-0 -translate-y-1/2 z-20 bg-surface border border-outline-variant border-r-0 rounded-l-xl px-1.5 py-3 shadow-md text-on-surface-variant hover:text-primary hover:bg-surface-container" title="Show preview">
      <span class="material-symbols-outlined text-[20px]">left_panel_open</span>
    </button>
  </main>
</template>
<div id="image-attach-modal" class="hidden fixed inset-0 z-[70] bg-on-background/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="bg-surface rounded-2xl w-full max-w-lg border border-outline-variant/30 shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
    <div class="p-4 border-b border-outline-variant/30 flex items-center justify-between shrink-0">
      <h3 class="font-semibold text-on-surface" id="img-modal-title">Add image</h3>
      <button type="button" id="img-modal-close" class="p-1 rounded-full hover:bg-surface-container text-on-surface-variant">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="p-4 space-y-4 overflow-y-auto flex-1 min-h-0">
      <div id="img-modal-previews" class="flex flex-wrap gap-2 empty:hidden"></div>
      <label class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-outline-variant rounded-xl p-6 cursor-pointer hover:border-primary hover:bg-surface-container-low transition-colors">
        <span class="material-symbols-outlined text-3xl text-primary">add_photo_alternate</span>
        <span class="text-sm text-on-surface">Upload image</span>
        <span class="text-xs text-on-surface-variant">PNG, JPG, GIF, WebP</span>
        <input type="file" id="img-modal-file" class="hidden" accept="image/png,image/jpeg,image/gif,image/webp,.png,.jpg,.jpeg,.gif,.webp" multiple/>
      </label>
      <div>
        <label class="text-sm text-on-surface-variant" for="img-modal-prompt">What should AI do with these images?</label>
        <textarea id="img-modal-prompt" rows="6" class="mt-1.5 w-full rounded-xl border-outline-variant bg-surface-container-low text-sm leading-relaxed" placeholder="e.g. Use this image under the book store example&#10;Use this image instead of the current one&#10;Use this image at the left side of the presentation"></textarea>
      </div>
    </div>
    <div class="p-4 border-t border-outline-variant/30 flex justify-end gap-2 shrink-0">
      <button type="button" id="img-modal-cancel" class="px-4 py-2 rounded-lg text-sm text-on-surface-variant hover:bg-surface-container">Cancel</button>
      <button type="button" id="img-modal-confirm" class="px-4 py-2 rounded-lg text-sm bg-primary text-on-primary">Confirm</button>
    </div>
  </div>
</div>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/chat.js"></script>
<script src="js/media.js"></script>
<script src="js/media-picker.js"></script>
<script src="js/identity-picker.js"></script>
<script src="js/class-picker.js"></script>
<script src="js/workspace.js"></script>
<script>
  XplainLayout.init({
    active: "workspace",
    overflowHidden: true,
    hideFooter: true,
    hideSidebar: true,
    hideTopbar: true,
    search: false,
  });

  let session = XplainWorkspace.ensureSessionFromUrl();
  let selectedIds = new Set(session.selected_section_ids || []);
  let sending = false;
  let previewCollapsed = sessionStorage.getItem("xplain-preview-collapsed") === "1";

  function applyPreviewLayout() {
    const chat = document.getElementById("chat-panel");
    const preview = document.getElementById("preview-panel");
    const reopen = document.getElementById("reopen-preview");
    const icon = document.getElementById("toggle-preview-icon");
    const toggle = document.getElementById("toggle-preview");
    if (previewCollapsed) {
      preview.classList.add("hidden");
      chat.classList.add("chat-expanded");
      reopen.classList.remove("hidden");
      icon.textContent = "right_panel_open";
      toggle.title = "Show preview";
    } else {
      preview.classList.remove("hidden");
      chat.classList.remove("chat-expanded");
      reopen.classList.add("hidden");
      icon.textContent = "right_panel_close";
      toggle.title = "Hide preview";
    }
    sessionStorage.setItem("xplain-preview-collapsed", previewCollapsed ? "1" : "0");
  }

  function togglePreview() {
    previewCollapsed = !previewCollapsed;
    applyPreviewLayout();
  }

  function syncSelected() {
    XplainStore.updateSession(session.id, {
      selected_section_ids: Array.from(selectedIds),
    });
    session = XplainStore.getSession(session.id);
    renderChips();
  }

  function mentionLabel(id) {
    if (id === "global-style") return "@Global Design Style";
    const m = id.match(/^page-(\d+)$/);
    if (m) return "@Page " + m[1];
    return "@" + id;
  }

  /** Pencil: insert visible @mention into chat (discovery decision) */
  function editViaPencil(id) {
    selectedIds.add(id);
    syncSelected();
    const input = document.getElementById("chat-input");
    const tag = mentionLabel(id);
    if (!input.value.includes(tag)) {
      input.value = (input.value.trim() ? input.value.trim() + " " : "") + tag + " ";
    }
    input.focus();
    input.placeholder = "Describe what to change…";
    renderRight();
  }

  function renderChips() {
    const box = document.getElementById("section-chips");
    box.innerHTML = Array.from(selectedIds)
      .map((id) => {
        const label =
          id === "global-style"
            ? "Global Design Style"
            : session.plan?.pages?.find((p) => p.id === id)?.title || id;
        return `<span class="chip">${XplainUI.escapeHtml(label)}
          <button type="button" data-rm="${id}" class="ml-0.5"><span class="material-symbols-outlined text-[14px]">close</span></button>
        </span>`;
      })
      .join("");
    box.querySelectorAll("[data-rm]").forEach((b) =>
      b.addEventListener("click", () => {
        selectedIds.delete(b.dataset.rm);
        syncSelected();
        renderRight();
      })
    );
  }

  function isConfirmPlanText(text) {
    return /I have enough information to create your lesson plan/i.test(text || "");
  }

  function renderMessages() {
    session = XplainStore.getSession(session.id);
    const el = document.getElementById("chat-messages");
    const messages = session.messages || [];
    const last = messages[messages.length - 1];
    if (
      last &&
      (last.meta?.confirm_plan || isConfirmPlanText(last.text)) &&
      !session.plan &&
      session.phase !== "generating_plan" &&
      session.phase !== "building" &&
      session.phase !== "ready" &&
      !session.awaiting_plan_confirm
    ) {
      XplainStore.updateSession(session.id, {
        awaiting_plan_confirm: true,
        agent_step: "confirm",
      });
      session = XplainStore.getSession(session.id);
    }
    const lastConfirmIdx = messages.reduce(
      (acc, x, i) => (x.meta?.confirm_plan || isConfirmPlanText(x.text) ? i : acc),
      -1
    );
    el.innerHTML = messages
      .map((m, msgIdx) => {
        if (m.role === "user") {
          return `<div class="chat-row chat-row-user w-full" dir="ltr">
            <div class="chat-meta">You</div>
            <div class="chat-bubble-user">${XplainUI.escapeHtml(m.text)}</div>
          </div>`;
        }

        let extras = "";
        if (m.meta?.confirm_plan || isConfirmPlanText(m.text)) {
          const planBusy =
            session.phase === "generating_plan" ||
            session.phase === "building" ||
            session.phase === "ready" ||
            !!(session.plan && session.agent_step === "plan_ready") ||
            messages.some((x) => x.meta?.draft || x.meta?.generating);
          // Sessions start in phase "planning"/intake — do not treat that as started.
          // Show CTAs only while this confirm is still the latest chat turn.
          const showConfirmBtns =
            !planBusy && msgIdx === lastConfirmIdx && msgIdx === messages.length - 1;
          if (showConfirmBtns) {
            extras += `<div class="flex flex-wrap gap-2 mt-1">
              <button type="button" class="btn-create-plan px-3.5 py-2 bg-primary text-on-primary rounded-lg text-sm font-medium hover:opacity-90">Make The Plan</button>
              <button type="button" class="btn-continue-disc px-3.5 py-2 border border-outline-variant rounded-lg text-sm text-on-surface hover:bg-surface-container">Continue discussion</button>
            </div>`;
          }
        }
        if (m.meta?.selected_sources?.length) {
          extras += `<div class="chat-card overflow-hidden">
            <div class="px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant bg-surface-container-low border-b border-outline-variant/40 flex items-center gap-1.5">
              <span class="material-symbols-outlined text-[15px] text-secondary">check_circle</span>
              ${m.meta.selected_sources.length} source${m.meta.selected_sources.length === 1 ? "" : "s"} selected
            </div>
            <ul class="divide-y divide-outline-variant/35">${m.meta.selected_sources
              .map(
                (s) => `<li class="flex items-center gap-2.5 px-3 py-2">
                <span class="w-8 h-8 rounded-lg bg-primary-container/35 text-primary flex items-center justify-center shrink-0">
                  <span class="material-symbols-outlined text-[18px]">${XplainUI.escapeHtml(s.icon || "description")}</span>
                </span>
                <span class="min-w-0 flex-1 text-left">
                  <span class="block text-sm font-medium text-on-surface truncate">${XplainUI.escapeHtml(s.label)}</span>
                  ${s.sub ? `<span class="block text-[11px] text-on-surface-variant truncate">${XplainUI.escapeHtml(s.sub)}</span>` : ""}
                </span>
              </li>`
              )
              .join("")}</ul>
          </div>`;
        }
        if (m.meta?.open_media_picker) {
          const hasSelected = !!m.meta?.selected_sources?.length;
          extras += `<div class="space-y-2">
            <button type="button" class="open-media-picker chat-cta ${hasSelected ? "chat-cta-secondary" : "chat-cta-primary"}">
              <span class="material-symbols-outlined text-[20px]">${hasSelected ? "add" : "folder_open"}</span>
              <span class="flex-1 text-left">
                <span class="block text-sm font-semibold">${hasSelected ? "Add more from library" : "Browse Media Library"}</span>
                <span class="block text-[11px] opacity-80 font-normal mt-0.5">${hasSelected ? "Search folders and pick more files" : "Search folders · select files"}</span>
              </span>
              <span class="material-symbols-outlined text-[18px] opacity-70">chevron_right</span>
            </button>
            ${
              (m.meta.recent || []).length
                ? `<div>
              <p class="text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant mb-1.5 px-0.5">Quick pick</p>
              <div class="grid gap-1.5">${m.meta.recent
                .map(
                  (o) => `<button type="button" class="pick-source chat-file-row" data-id="${o.id}">
                  <span class="w-8 h-8 rounded-lg bg-surface-container-high text-on-surface-variant flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-[18px]">${XplainUI.escapeHtml(o.icon || "description")}</span>
                  </span>
                  <span class="min-w-0 flex-1 text-left">
                    <span class="block text-sm font-medium text-on-surface truncate">${XplainUI.escapeHtml(o.label)}</span>
                    ${o.sub ? `<span class="block text-[11px] text-on-surface-variant truncate">${XplainUI.escapeHtml(o.sub)}</span>` : ""}
                  </span>
                  <span class="material-symbols-outlined text-[16px] text-on-surface-variant">add_circle</span>
                </button>`
                )
                .join("")}</div>
            </div>`
                : ""
            }
          </div>`;
        }
        if (m.meta?.pick_sources) {
          extras += `<button type="button" class="open-media-picker chat-cta chat-cta-primary">
            <span class="material-symbols-outlined text-[20px]">folder_open</span>
            <span class="flex-1 text-left text-sm font-semibold">Browse Media Library</span>
            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
          </button>`;
        }
        if (m.meta?.pick_identity) {
          const opts = m.meta.options || [];
          const quick = opts.slice(0, 3);
          extras += `<div class="space-y-2">
            <button type="button" class="open-identity-picker chat-cta chat-cta-primary">
              <span class="material-symbols-outlined text-[20px]">palette</span>
              <span class="flex-1 text-left">
                <span class="block text-sm font-semibold">Browse Identity Gallery</span>
                <span class="block text-[11px] opacity-80 font-normal mt-0.5">${opts.length} identities · search &amp; select</span>
              </span>
              <span class="material-symbols-outlined text-[18px] opacity-70">chevron_right</span>
            </button>
            ${
              quick.length
                ? `<div>
              <p class="text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant mb-1.5 px-0.5">Quick pick</p>
              <div class="grid gap-1.5">${quick
                .map(
                  (o) => `<button type="button" class="pick-identity chat-option-row" data-id="${o.id}">
                <span class="w-8 h-8 rounded-lg shrink-0 flex" style="background:linear-gradient(135deg,${o.primary || "#7B4DFF"},${o.secondary || "#F5A623"})"></span>
                <span class="min-w-0 flex-1 text-left">
                  <span class="block text-sm font-medium text-on-surface truncate">${XplainUI.escapeHtml(o.label)}</span>
                  <span class="block text-[11px] text-on-surface-variant truncate">${XplainUI.escapeHtml(o.sub || "")}</span>
                </span>
              </button>`
                )
                .join("")}</div>
            </div>`
                : ""
            }
            <button type="button" class="open-identity-create inline-flex items-center gap-1 text-xs font-medium text-primary hover:underline px-0.5">
              <span class="material-symbols-outlined text-[14px]">add</span> Create new identity
            </button>
          </div>`;
        }
        if (m.meta?.pick_class) {
          const opts = m.meta.options || [];
          const quick = opts.slice(0, 3);
          extras += `<div class="space-y-2">
            <button type="button" class="open-class-picker chat-cta chat-cta-primary">
              <span class="material-symbols-outlined text-[20px]">groups</span>
              <span class="flex-1 text-left">
                <span class="block text-sm font-semibold">Browse Class Gallery</span>
                <span class="block text-[11px] opacity-80 font-normal mt-0.5">${opts.length} classes · search &amp; select</span>
              </span>
              <span class="material-symbols-outlined text-[18px] opacity-70">chevron_right</span>
            </button>
            ${
              quick.length
                ? `<div>
              <p class="text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant mb-1.5 px-0.5">Quick pick</p>
              <div class="grid gap-1.5">${quick
                .map(
                  (o) => `<button type="button" class="pick-class chat-option-row" data-id="${o.id}">
                <span class="w-8 h-8 rounded-lg shrink-0 flex items-center justify-center text-white" style="background:${o.accent || "#7B4DFF"}">
                  <span class="material-symbols-outlined text-[18px]">groups</span>
                </span>
                <span class="min-w-0 flex-1 text-left">
                  <span class="block text-sm font-medium text-on-surface truncate">${XplainUI.escapeHtml(o.label)}</span>
                  <span class="block text-[11px] text-on-surface-variant truncate">${XplainUI.escapeHtml(o.sub || "")}</span>
                </span>
              </button>`
                )
                .join("")}</div>
            </div>`
                : ""
            }
            <button type="button" class="open-class-create inline-flex items-center gap-1 text-xs font-medium text-primary hover:underline px-0.5">
              <span class="material-symbols-outlined text-[14px]">add</span> Create new class
            </button>
          </div>`;
        }
        if (m.meta?.quick_replies?.length) {
          extras += `<div class="flex flex-wrap gap-1.5">${m.meta.quick_replies
            .map(
              (q) =>
                `<button type="button" class="quick-reply chat-chip" data-text="${XplainUI.escapeHtml(q)}">${XplainUI.escapeHtml(q)}</button>`
            )
            .join("")}</div>`;
        }
        if (m.meta?.actions?.length) {
          extras += `<div class="flex flex-wrap gap-2">${m.meta.actions
            .map(
              (a) =>
                `<button type="button" class="chat-action px-3.5 py-2 bg-primary text-on-primary rounded-lg text-sm font-medium hover:opacity-90" data-action="${a.id}">${XplainUI.escapeHtml(a.label)}</button>`
            )
            .join("")}</div>`;
        }
        if (m.meta?.draft) {
          extras += `<div class="chat-card flex items-center gap-2 px-3 py-2 text-sm">
              <span class="material-symbols-outlined text-secondary text-lg">check_circle</span>
              <span class="font-medium text-sm">Draft ready — review on the right</span>
            </div>`;
        }
        if (m.meta?.generating) {
          const stillGen =
            session.phase === "generating_plan" || XplainChat.isGenerating(session.id);
          if (stillGen) {
            extras += `<div class="chat-card flex items-center gap-2.5 px-3 py-2.5 text-sm">
              <span class="material-symbols-outlined text-primary text-lg animate-spin">progress_activity</span>
              <span class="min-w-0">
                <span class="block font-medium text-sm text-on-surface">Draft in progress</span>
                <span class="block text-[11px] text-on-surface-variant mt-0.5">Sections appear on the right as they’re ready</span>
              </span>
            </div>`;
          }
        }

        return `<div class="chat-row chat-row-ai w-full" dir="ltr">
          <div class="chat-meta">
            <span class="chat-avatar material-symbols-outlined">smart_toy</span>
            <span>Agent</span>
          </div>
          <div class="chat-bubble-ai">${XplainUI.escapeHtml(m.text)}</div>
          ${extras ? `<div class="chat-extras">${extras}</div>` : ""}
        </div>`;
      })
      .join("");

    el.querySelectorAll(".btn-create-plan").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (btn.dataset.busy === "1") return;
        btn.dataset.busy = "1";
        btn.disabled = true;
        document.querySelectorAll(".btn-create-plan").forEach((b) => {
          b.disabled = true;
        });
        try {
          await XplainChat.createLessonPlan(session.id);
        } finally {
          renderAll();
        }
      });
    });
    el.querySelectorAll(".btn-continue-disc").forEach((btn) => {
      btn.addEventListener("click", () => {
        XplainChat.continueDiscussion(session.id);
        renderAll();
      });
    });
    el.querySelectorAll(".open-media-picker").forEach((btn) => {
      btn.addEventListener("click", () => {
        const sess = XplainStore.getSession(session.id);
        XplainMediaPicker.open({
          sessionId: session.id,
          preselected: sess.media_ids || [],
          onDone(ids) {
            XplainChat.selectSources(session.id, ids);
            renderAll();
          },
        });
      });
    });
    el.querySelectorAll(".pick-source").forEach((btn) => {
      btn.addEventListener("click", () => {
        XplainChat.selectSource(session.id, btn.dataset.id);
        renderAll();
      });
    });
    const openIdentityGallery = (createMode) => {
      XplainIdentityPicker.open({
        sessionId: session.id,
        startCreate: !!createMode,
        onDone(id) {
          XplainChat.selectIdentity(session.id, id);
          setTimeout(renderAll, 250);
        },
      });
    };
    el.querySelectorAll(".open-identity-picker").forEach((btn) => {
      btn.addEventListener("click", () => openIdentityGallery(false));
    });
    el.querySelectorAll(".open-identity-create").forEach((btn) => {
      btn.addEventListener("click", () => openIdentityGallery(true));
    });
    el.querySelectorAll(".pick-identity").forEach((btn) => {
      btn.addEventListener("click", () => {
        XplainChat.selectIdentity(session.id, btn.dataset.id);

      });

      XplainClassPicker.open({

          XplainChat.selectClass(session.id, id);
          setTimeout(renderAll, 250);
        },
      });

      btn.addEventListener("click", () => openClassGallery(false));

      btn.addEventListener("click", () => openClassGallery(true));

      )
      .join("");

      btn.addEventListener("click", () => {

        refreshImageModalPreviews();
      });

    imageModalTarget = targetId;

  function renderGeneratingPlan() {
    const gen = session.plan_gen;
    const steps = gen?.steps || [];
    const plan = session.plan || {};
    const pages = plan.pages || [];
    const doneCount = steps.filter((s) => s.status === "done").length;
    const total = steps.length || 1;
    const pct = Math.round((doneCount / total) * 100);
    const current = steps.find((s) => s.status === "generating");
    const statusCopy =
      gen?.status_text ||
      (current
        ? `Writing ${current.label}…`
        : doneCount >= total
          ? "Finishing draft…"
          : "Preparing outline…");

    const stepCard = (s, idx) => {
      const isStyle = s.key === "style";
      const page = isStyle ? null : pages.find((p) => p.id === s.key);
      const title = isStyle
        ? "Global Design Style"
        : page?.title || s.label || `Page ${idx}`;
      const subtitle = isStyle
        ? "Colors · typography · visual rules"
        : page
          ? `${page.minutes || "—"} min · ${(page.type || "section").replace(/_/g, " ")}`
          : "Lesson section";
      const icon = isStyle ? "palette" : XplainUI.sectionIcon(page?.type);
      const st = s.status || "pending";
      const stateCls =
        st === "done"
          ? "plan-gen-card is-done"
          : st === "generating"
            ? "plan-gen-card is-active"
            : "plan-gen-card is-pending";
      const badge =
        st === "done"
          ? `<span class="plan-gen-badge plan-gen-badge-done"><span class="material-symbols-outlined text-[16px]">check_circle</span> Ready</span>`
          : st === "generating"
            ? `<span class="plan-gen-badge plan-gen-badge-active"><span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span> Writing</span>`
            : `<span class="plan-gen-badge plan-gen-badge-wait">Queued</span>`;

      return `
<article class="${stateCls}" style="animation-delay:${idx * 40}ms">
  <div class="plan-gen-thumb ${st === "pending" ? "skeleton" : ""}">
    <span class="material-symbols-outlined plan-gen-thumb-icon">${icon}</span>
    ${st === "generating" ? `<span class="plan-gen-pulse"></span>` : ""}
  </div>
  <div class="plan-gen-body min-w-0">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <p class="text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant mb-0.5">${isStyle ? "Style" : `Page ${page?.number || idx}`}</p>
        <h3 class="font-semibold text-on-surface text-sm truncate leading-snug">${XplainUI.escapeHtml(title)}</h3>
        <p class="text-xs text-on-surface-variant mt-0.5 truncate capitalize">${XplainUI.escapeHtml(subtitle)}</p>
      </div>
      ${badge}

    ${
      st === "generating"
        ? `<div class="plan-gen-lines mt-3" aria-hidden="true">
      <span class="skeleton h-2 rounded w-[92%] block"></span>
      <span class="skeleton h-2 rounded w-[70%] block mt-1.5"></span>
      <span class="skeleton h-2 rounded w-[80%] block mt-1.5"></span>
    </div>`
        : st === "done"
          ? `<p class="text-xs text-success mt-2 flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">done_all</span> Added to draft</p>`
          : `<p class="text-xs text-on-surface-variant/70 mt-2">Waiting…</p>`
    }
  </div>
</article>`;
    };

    return `

          <path class="plan-gen-ring-bg" pathLength="100" d="M18 2.5a15.5 15.5 0 1 1 0 31 15.5 15.5 0 1 1 0-31"/>
          <path class="plan-gen-ring-fg" pathLength="100" stroke-dasharray="${pct} 100" d="M18 2.5a15.5 15.5 0 1 1 0 31 15.5 15.5 0 1 1 0-31"/>

        <span class="plan-gen-pct-num">${pct}%</span>

  function bindPencils(pane) {
    pane.querySelectorAll(".pencil-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        editViaPencil(btn.dataset.edit);
      });

  function renderRight() {
    session = XplainStore.getSession(session.id);
    const pane = document.getElementById("right-pane");

    // Only recover stuck sessions — never interrupt an active generation run.
    if (
      session.phase === "generating_plan" &&
      XplainChat.isPlanViewable(session) &&
      !XplainChat.isGenerating(session.id)
    ) {
      XplainChat.finalizeStuckPlan(session.id);
      session = XplainStore.getSession(session.id);
    }

    if (session.phase === "generating_plan") {
      pane.innerHTML = renderGeneratingPlan();
    } else if (session.phase === "building") {
      pane.innerHTML = renderBuilding();
      bindImageButtons(pane);
    } else if (session.phase === "ready" && (session.readyContent || session.lesson_id)) {
      pane.innerHTML = renderReady();
      bindPencils(pane);
      bindImageButtons(pane);
      pane.querySelectorAll("[data-export]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await XplainWorkspace.exportLesson(session.id, btn.dataset.export);
          renderAll();
        });
      });
    } else if (session.plan && (session.phase === "planning" || XplainChat.isPlanViewable(session))) {
      pane.innerHTML = renderPlanPanel();
      bindPencils(pane);
      bindImageButtons(pane);
      document.getElementById("btn-approve")?.addEventListener("click", async () => {
        const b = document.getElementById("btn-approve");
        if (b) b.disabled = true;
        await XplainWorkspace.approve(session.id);
        selectedIds.clear();
        renderAll();
      });
    } else {
      pane.innerHTML = renderEmptyPlan();
    }
    renderChips();
  }

  function renderAll() {
    session = XplainStore.getSession(session.id);
    selectedIds = new Set(session.selected_section_ids || []);
    renderMessages();
    renderRight();
  }

  async function send() {
    if (sending) return;
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;
    sending = true;
    const refs = Array.from(selectedIds);
    input.value = "";
    input.style.height = "";
    hideMentions();
    renderMessages();
    session = XplainStore.getSession(session.id);
    if (session.phase === "ready" && refs.length) {
      await XplainWorkspace.reviseBuiltSection(session.id, refs[0], text);
      selectedIds.clear();
      syncSelected();
    } else {
      await XplainChat.sendTeacherMessage(session.id, text, refs);
    }
    sending = false;
    renderAll();
  }

  function hideMentions() {
    document.getElementById("mention-menu").classList.add("hidden");
  }

  function showMentions(query) {
    const menu = document.getElementById("mention-menu");
    const items = XplainChat.getMentionSuggestions(query);
    if (!items.length) {
      hideMentions();
      return;
    }
    menu.classList.remove("hidden");
    menu.innerHTML = items
      .map(
        (it) => `<button type="button" class="mention-item w-full flex items-center gap-2 px-3 py-2 text-sm text-left hover:bg-surface-container" data-label="${XplainUI.escapeHtml(it.label)}" data-id="${it.id}">
      <span class="material-symbols-outlined text-primary text-lg">${it.icon}</span>
      <span class="truncate">${XplainUI.escapeHtml(it.label)}</span>
      <span class="ml-auto text-xs text-on-surface-variant">${it.type}</span>
    </button>`
      )
      .join("");
    menu.querySelectorAll(".mention-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById("chat-input");
        const at = input.value.lastIndexOf("@");
        input.value =
          (at >= 0 ? input.value.slice(0, at) : input.value) +
          "@" +
          btn.dataset.label +
          " ";
        if (btn.dataset.id) selectedIds.add(btn.dataset.id);
        syncSelected();
        hideMentions();
        input.focus();
      });
    });
  }

  document.getElementById("chat-send").addEventListener("click", send);
  document.getElementById("toggle-preview").addEventListener("click", togglePreview);
  document.getElementById("reopen-preview").addEventListener("click", togglePreview);

  const imgModal = document.getElementById("image-attach-modal");
  document.getElementById("img-modal-close").addEventListener("click", closeImageModal);
  document.getElementById("img-modal-cancel").addEventListener("click", closeImageModal);
  imgModal.addEventListener("click", (e) => {
    if (e.target === imgModal) closeImageModal();
  });
  document.getElementById("img-modal-file").addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length || !imageModalTarget) return;
    for (const file of files) {
      if (!XplainMedia.isImageFile(file)) continue;
      await XplainWorkspace.addImageToTarget(session.id, imageModalTarget, file);
    }
    session = XplainStore.getSession(session.id);
    e.target.value = "";
    refreshImageModalPreviews();
  });
  document.getElementById("img-modal-confirm").addEventListener("click", async () => {
    if (!imageModalTarget) return;
    const prompt = document.getElementById("img-modal-prompt").value;
    const btn = document.getElementById("img-modal-confirm");
    btn.disabled = true;
    const ok = await XplainWorkspace.confirmImageAttachment(
      session.id,
      imageModalTarget,
      prompt
    );
    btn.disabled = false;
    if (ok) {
      closeImageModal();
      renderAll();
    }
  });

  document.getElementById("chat-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  document.getElementById("chat-input").addEventListener("input", (e) => {
    const input = e.target;
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 112) + "px";
    const v = input.value;
    const at = v.lastIndexOf("@");
    if (at >= 0 && !/\s/.test(v.slice(at + 1))) showMentions(v.slice(at + 1));
    else hideMentions();
  });
  document.getElementById("attach-btn").addEventListener("click", () => {
    const input = document.getElementById("chat-input");
    input.value += input.value && !input.value.endsWith(" ") ? " @" : "@";
    input.focus();
    showMentions("");
  });

  applyPreviewLayout();

  window.addEventListener("xplain:store", () => {
    try {
      const s = XplainStore.getSession(session.id);
      if (s) {
        session = s;
        renderMessages();
        renderRight();
      }
    } catch (err) {
      console.error("workspace store refresh failed", err);
    }
  });

  // Recover only if a previous run died mid-generation (no live lock).
  (async function bootSeed() {
    session = XplainStore.getSession(session.id) || session;
    if (
      session.phase === "generating_plan" &&
      !XplainChat.isGenerating(session.id)
    ) {
      XplainChat.finalizeStuckPlan(session.id);
      session = XplainStore.getSession(session.id);
    }
    const seed = sessionStorage.getItem("xplain-seed-prompt");
    if (seed && session.messages.length <= 1) {
      sessionStorage.removeItem("xplain-seed-prompt");
      await XplainChat.sendTeacherMessage(session.id, seed, []);
    }
    renderAll();
  })();
</script>
</body>
</html>
