<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Platform Admin Login — getXplain</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/app.css"/>
</head>
<body class="bg-background text-on-background antialiased min-h-screen">
<div class="min-h-screen flex flex-col">
  <header class="px-6 py-5 flex items-center gap-3">
    <img src="../assets/logo.png" alt="getXplain" class="w-9 h-9 rounded-lg object-contain bg-white border border-outline-variant/40 p-0.5"/>
    <div>
      <span class="font-headline-md font-bold text-on-surface text-lg">get<span class="text-primary">X</span>plain</span>
      <span class="ml-2 text-xs uppercase tracking-wider text-on-surface-variant">Platform</span>
    </div>
  </header>
  <main class="flex-1 flex items-center justify-center px-4 pb-16">
    <div class="w-full max-w-md">
      <div class="bg-surface border border-outline-variant rounded-2xl p-8 shadow-sm">
        <h1 class="text-2xl font-semibold text-on-surface mb-1">Admin dashboard</h1>
        <p class="text-sm text-on-surface-variant mb-6">Sign in with a platform admin account.</p>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="text-sm text-on-surface-variant" for="email">Email</label>
            <input id="email" type="email" required autocomplete="username"
              class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low focus:border-primary focus:ring-primary"
              placeholder="admin@getxplain.ai"/>
          </div>
          <div>
            <label class="text-sm text-on-surface-variant" for="password">Password</label>
            <input id="password" type="password" required autocomplete="current-password"
              class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low focus:border-primary focus:ring-primary"/>
          </div>
          <p id="error" class="hidden text-sm text-error"></p>
          <button type="submit" class="w-full py-3 bg-primary-container text-on-primary-container rounded-xl font-medium hover:opacity-90">
            Sign in
          </button>
        </form>
      </div>
      <p class="text-xs text-on-surface-variant mt-4 text-center">
        Demo: admin@getxplain.ai / admin123 ·
        <a href="../login.html" class="text-primary hover:underline">Teacher login</a>
      </p>
    </div>
  </main>
</div>
<script src="../js/seed.js"></script>
<script src="../js/store.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>
<script>
  XplainLayout.applyTailwind();
  XplainUI.attachPasswordToggle("password");
  if (XplainStore.getAuthSession()?.kind === "platform") {
    location.replace("dashboard.html");
  }

  document.getElementById("login-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const err = document.getElementById("error");
    err.classList.add("hidden");
    const result = XplainStore.platformLogin(
      document.getElementById("email").value,
      document.getElementById("password").value
    );
    if (!result.ok) {
      err.textContent = result.error;
      err.classList.remove("hidden");
      return;
    }
    location.href = "dashboard.html";
  });
</script>
</body>
</html>
