<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Identities - Xplain AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app-shell"></div>
<template id="page-template">
  <main class="flex-1 p-4 md:p-16 overflow-y-auto">
    <div class="max-w-5xl mx-auto space-y-8">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <h1 class="text-3xl font-semibold text-on-surface">Identity Management</h1>
          <p class="text-on-surface-variant mt-2 max-w-xl">
            Brand sets for lessons: primary/secondary colors, logo, background style, and image style (cartoon vs realistic). Chat will ask you to pick one when planning.
          </p>
        </div>
        <button id="btn-new" class="px-4 py-2.5 bg-primary-container text-on-primary-container rounded-lg text-sm flex items-center gap-2">
          <span class="material-symbols-outlined text-sm">add</span> New Identity
        </button>
      </div>
      <div id="identity-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>
  </main>

  <div id="identity-modal" class="hidden fixed inset-0 z-50 bg-on-background/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-surface rounded-2xl w-full max-w-lg border border-outline-variant/30 overflow-hidden max-h-[90vh] overflow-y-auto">
      <div class="p-5 border-b border-outline-variant/30 flex justify-between items-center sticky top-0 bg-surface z-10">
        <h3 class="text-xl font-semibold" id="modal-title">New Identity</h3>
        <button type="button" data-close class="p-1 rounded-full hover:bg-surface-container"><span class="material-symbols-outlined">close</span></button>
      </div>
      <form id="identity-form" class="p-5 space-y-4">
        <input type="hidden" id="identity-id"/>
        <div>
          <label class="text-sm text-on-surface-variant">Name</label>
          <input required id="f-name" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low" placeholder="Inventors Academy Kids"/>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-sm text-on-surface-variant">Primary color</label>
            <div class="mt-1 flex gap-2 items-center">
              <input type="color" id="f-primary" value="#622ce5" class="h-10 w-12 rounded border border-outline-variant cursor-pointer"/>
              <input id="f-primary-hex" class="flex-1 rounded-lg border-outline-variant bg-surface-container-low text-sm" value="#622ce5"/>
            </div>
          </div>
          <div>
            <label class="text-sm text-on-surface-variant">Secondary color</label>
            <div class="mt-1 flex gap-2 items-center">
              <input type="color" id="f-secondary" value="#feae2c" class="h-10 w-12 rounded border border-outline-variant cursor-pointer"/>
              <input id="f-secondary-hex" class="flex-1 rounded-lg border-outline-variant bg-surface-container-low text-sm" value="#feae2c"/>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-sm text-on-surface-variant">Background</label>
            <select id="f-bg" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low">
              <option value="simple_white">Simple white</option>
              <option value="soft_color">Soft color wash</option>
              <option value="patterned">Light pattern</option>
            </select>
          </div>
          <div>
            <label class="text-sm text-on-surface-variant">Image style</label>
            <select id="f-image" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low">
              <option value="realistic">Realistic photos</option>
              <option value="cartoon">Cartoon illustrations</option>
              <option value="diagram">Scientific diagrams</option>
              <option value="mixed">Mixed</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-sm text-on-surface-variant">Typography</label>
            <input id="f-type" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low" placeholder="Modern Rounded"/>
          </div>
          <div>
            <label class="text-sm text-on-surface-variant">Layout</label>
            <input id="f-layout" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low" placeholder="Clean & Educational"/>
          </div>
        </div>
        <div>
          <label class="text-sm text-on-surface-variant">Style instructions</label>
          <textarea id="f-instructions" rows="3" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low" placeholder="e.g. Prefer white backgrounds, large cartoon characters, short sentences…"></textarea>
        </div>
        <div>
          <label class="text-sm text-on-surface-variant">Logo</label>
          <div class="mt-2 flex items-center gap-3">
            <div id="logo-preview" class="w-14 h-14 rounded-lg border border-outline-variant flex items-center justify-center overflow-hidden bg-surface-container-low">
              <span class="material-symbols-outlined text-on-surface-variant">image</span>
            </div>
            <input type="file" id="f-logo" accept="image/*" class="text-sm"/>
          </div>
        </div>
        <label class="flex items-center gap-2 text-sm text-on-surface">
          <input type="checkbox" id="f-default" class="rounded border-outline-variant text-primary"/>
          Set as default identity
        </label>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" data-close class="px-4 py-2 text-on-surface-variant hover:bg-surface-container rounded-lg">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-primary text-on-primary rounded-lg">Save</button>
        </div>
      </form>
    </div>
  </div>
</template>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/chat.js"></script>
<script>
  XplainLayout.init({ active: "identities", title: "Identities" });

  let logoData = null;

  function syncColor(pickerId, hexId) {
    const p = document.getElementById(pickerId);
    const h = document.getElementById(hexId);
    p.addEventListener("input", () => { h.value = p.value; });
    h.addEventListener("change", () => {
      if (/^#[0-9a-fA-F]{6}$/.test(h.value)) p.value = h.value;
    });
  }
  syncColor("f-primary", "f-primary-hex");
  syncColor("f-secondary", "f-secondary-hex");

  function openModal(id) {
    logoData = null;
    document.getElementById("identity-form").reset();
    document.getElementById("identity-id").value = "";
    document.getElementById("logo-preview").innerHTML =
      '<span class="material-symbols-outlined text-on-surface-variant">image</span>';
    document.getElementById("f-primary").value = "#622ce5";
    document.getElementById("f-primary-hex").value = "#622ce5";
    document.getElementById("f-secondary").value = "#feae2c";
    document.getElementById("f-secondary-hex").value = "#feae2c";
    document.getElementById("modal-title").textContent = "New Identity";

    if (id) {
      const i = XplainStore.getIdentity(id);
      if (!i) return;
      document.getElementById("modal-title").textContent = "Edit Identity";
      document.getElementById("identity-id").value = i.id;
      document.getElementById("f-name").value = i.name;
      document.getElementById("f-primary").value = i.primary;
      document.getElementById("f-primary-hex").value = i.primary;
      document.getElementById("f-secondary").value = i.secondary;
      document.getElementById("f-secondary-hex").value = i.secondary;
      document.getElementById("f-bg").value = i.background_style;
      document.getElementById("f-image").value = i.image_style;
      document.getElementById("f-type").value = i.typography || "";
      document.getElementById("f-layout").value = i.layout || "";
      document.getElementById("f-instructions").value = i.instructions || "";
      document.getElementById("f-default").checked =
        XplainStore.getTeacher().default_identity_id === i.id;
      if (i.logo_data_url) {
        logoData = i.logo_data_url;
        document.getElementById("logo-preview").innerHTML =
          `<img src="${i.logo_data_url}" class="w-full h-full object-cover" alt=""/>`;
      }
    }
    XplainUI.openModal("identity-modal");
  }

  function render() {
    const def = XplainStore.getTeacher().default_identity_id;
    const list = XplainStore.getIdentities();
    document.getElementById("identity-grid").innerHTML = list.map((i) => `
<div class="bg-surface border border-outline-variant rounded-xl overflow-hidden flex flex-col">
  <div class="h-3 flex">
    <div class="flex-1" style="background:${i.primary}"></div>
    <div class="flex-1" style="background:${i.secondary}"></div>
  </div>
  <div class="p-5 flex-1">
    <div class="flex items-start justify-between gap-2 mb-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-11 h-11 rounded-lg border border-outline-variant overflow-hidden flex items-center justify-center shrink-0 bg-surface-container-low">
          ${i.logo_data_url ? `<img src="${i.logo_data_url}" class="w-full h-full object-cover"/>` : `<span class="material-symbols-outlined text-on-surface-variant">badge</span>`}
        </div>
        <div class="min-w-0">
          <h3 class="font-semibold text-on-surface truncate">${XplainUI.escapeHtml(i.name)}</h3>
          ${def === i.id ? `<span class="text-[10px] uppercase tracking-wide text-primary font-semibold">Default</span>` : ""}
        </div>
      </div>
      <div class="flex gap-1">
        <button type="button" class="edit-btn p-1.5 rounded-lg hover:bg-surface-container text-on-surface-variant" data-id="${i.id}"><span class="material-symbols-outlined text-sm">edit</span></button>
        <button type="button" class="del-btn p-1.5 rounded-lg hover:bg-surface-container text-error" data-id="${i.id}"><span class="material-symbols-outlined text-sm">delete</span></button>
      </div>
    </div>
    <dl class="space-y-1.5 text-sm text-on-surface-variant">
      <div class="flex justify-between gap-2"><dt>Background</dt><dd class="text-on-surface text-right">${XplainUI.escapeHtml(XplainChat.bgLabel(i.background_style))}</dd></div>
      <div class="flex justify-between gap-2"><dt>Images</dt><dd class="text-on-surface text-right">${XplainUI.escapeHtml(XplainChat.imageLabel(i.image_style))}</dd></div>
      <div class="flex justify-between gap-2"><dt>Type</dt><dd class="text-on-surface text-right truncate">${XplainUI.escapeHtml(i.typography || "—")}</dd></div>
    </dl>
    ${i.instructions ? `<p class="mt-3 text-xs text-on-surface-variant line-clamp-2">${XplainUI.escapeHtml(i.instructions)}</p>` : ""}
  </div>
  <div class="px-5 py-3 border-t border-outline-variant/40 bg-surface-container-lowest text-xs text-on-surface-variant">
    Primary ${i.primary} · Secondary ${i.secondary}
  </div>
</div>`).join("") || `<p class="text-on-surface-variant col-span-full">No identities yet. Create one to use in chat.</p>`;

    document.querySelectorAll(".edit-btn").forEach((b) =>
      b.addEventListener("click", () => openModal(b.dataset.id))
    );
    document.querySelectorAll(".del-btn").forEach((b) =>
      b.addEventListener("click", () => {
        if (confirm("Delete this identity?")) {
          XplainStore.deleteIdentity(b.dataset.id);
          render();
        }
      })
    );
  }

  document.getElementById("btn-new").addEventListener("click", () => openModal());
  document.querySelectorAll("[data-close]").forEach((b) =>
    b.addEventListener("click", () => XplainUI.closeModal("identity-modal"))
  );
  document.getElementById("f-logo").addEventListener("change", (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      logoData = reader.result;
      document.getElementById("logo-preview").innerHTML =
        `<img src="${logoData}" class="w-full h-full object-cover" alt=""/>`;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("identity-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const id = document.getElementById("identity-id").value;
    const data = {
      name: document.getElementById("f-name").value.trim(),
      primary: document.getElementById("f-primary-hex").value.trim(),
      secondary: document.getElementById("f-secondary-hex").value.trim(),
      background_style: document.getElementById("f-bg").value,
      image_style: document.getElementById("f-image").value,
      typography: document.getElementById("f-type").value.trim(),
      layout: document.getElementById("f-layout").value.trim(),
      instructions: document.getElementById("f-instructions").value.trim(),
      logo_data_url: logoData,
    };
    let savedId = id;
    if (id) {
      XplainStore.updateIdentity(id, data);
    } else {
      savedId = XplainStore.addIdentity(data).id;
    }
    if (document.getElementById("f-default").checked) {
      XplainStore.updateTeacher({ default_identity_id: savedId });
    }
    XplainUI.closeModal("identity-modal");
    XplainUI.toast("Identity saved", data.name, { icon: "check" });
    render();
  });

  render();
</script>
</body>
</html>
