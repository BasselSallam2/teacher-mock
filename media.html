<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Library - Xplain AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app-shell"></div>
<template id="page-template">
  <div class="flex-1 p-4 md:p-16 overflow-y-auto">
    <div class="max-w-6xl mx-auto space-y-8">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
          <h2 class="text-3xl font-semibold text-on-surface mb-2">Media Library</h2>
          <p class="text-on-surface-variant">Manage and index your academic resources for AI processing.</p>
        </div>
        <div class="flex items-center gap-3">
          <select id="media-filter" class="px-4 py-2 border border-outline rounded-lg text-sm bg-surface">
            <option value="all">All statuses</option>
            <option value="indexed">Indexed</option>
            <option value="processing">Processing</option>
            <option value="failed">Failed</option>
          </select>
          <button id="btn-upload" class="flex items-center gap-2 px-4 py-2 bg-primary text-on-primary rounded-lg text-sm shadow-sm">
            <span class="material-symbols-outlined text-sm">upload</span> Upload Resource
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="stats-row"></div>

      <section>
        <h3 class="text-lg font-semibold text-on-surface mb-4">Resource Folders</h3>
        <div id="folder-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      </section>

      <div class="bg-surface rounded-xl border border-outline-variant/50 overflow-hidden">
        <div class="grid grid-cols-12 gap-4 p-4 border-b border-outline-variant/50 bg-surface-container-low text-on-surface-variant text-xs uppercase tracking-wider">
          <div class="col-span-6 md:col-span-5">Name</div>
          <div class="col-span-3 hidden md:block">Uploaded By</div>
          <div class="col-span-3 md:col-span-2">Size</div>
          <div class="col-span-3 md:col-span-2">Status</div>
        </div>
        <div id="media-list" class="divide-y divide-outline-variant/30"></div>
      </div>
    </div>
  </div>

  <div id="upload-modal" class="hidden fixed inset-0 z-50 bg-on-background/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-surface rounded-2xl shadow-lg w-full max-w-md overflow-hidden border border-outline-variant/30">
      <div class="p-6 border-b border-outline-variant/30 flex justify-between items-center">
        <h3 class="text-xl font-semibold">Upload Resource</h3>
        <button type="button" data-close-upload class="p-1 rounded-full hover:bg-surface-container"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="p-6 space-y-6">
        <div id="drop-zone" class="border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center text-center hover:bg-surface-container-low hover:border-primary transition-colors cursor-pointer">
          <div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-4">
            <span class="material-symbols-outlined">cloud_upload</span>
          </div>
          <p class="text-on-surface mb-1">Click to browse or drag and drop</p>
          <p class="text-xs text-on-surface-variant">PDF, PPTX, DOCX up to 50MB (mock — file stays local)</p>
          <input type="file" id="file-input" class="hidden" accept=".pdf,.pptx,.docx,.txt,.png,.jpg"/>
        </div>
        <div id="upload-progress" class="hidden bg-surface-container-low rounded-lg p-4 border border-outline-variant/30">
          <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="material-symbols-outlined text-primary text-sm">picture_as_pdf</span>
              <span id="upload-name" class="text-sm font-medium truncate"></span>
            </div>
            <span id="upload-pct" class="text-xs text-on-surface-variant">0%</span>
          </div>
          <div class="w-full bg-surface-variant h-1.5 rounded-full overflow-hidden">
            <div id="upload-bar" class="bg-primary h-full rounded-full transition-all" style="width:0%"></div>
          </div>
          <p id="upload-label" class="text-xs text-on-surface-variant mt-2 text-right">Uploading…</p>
        </div>
        <div>
          <label class="text-sm text-on-surface-variant">Or simulate by name</label>
          <div class="flex gap-2 mt-1">
            <input id="fake-name" class="flex-1 rounded-lg border-outline-variant bg-surface-container-low text-sm" placeholder="e.g. Unit3.pdf or scanned_fail.pdf"/>
            <button type="button" id="btn-fake-upload" class="px-3 py-2 bg-surface-container rounded-lg text-sm border border-outline-variant">Add</button>
          </div>
        </div>
      </div>
      <div class="p-4 border-t border-outline-variant/30 bg-surface-container-lowest flex justify-end gap-3">
        <button type="button" data-close-upload class="px-4 py-2 text-on-surface-variant hover:bg-surface-container rounded-lg">Cancel</button>
        <button type="button" data-close-upload class="px-4 py-2 bg-primary text-on-primary rounded-lg">Done</button>
      </div>
    </div>
  </div>

  <div id="rename-modal" class="hidden fixed inset-0 z-50 bg-on-background/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-surface rounded-xl p-6 w-full max-w-sm border border-outline-variant">
      <h3 class="font-semibold mb-3">Rename resource</h3>
      <input id="rename-input" class="w-full rounded-lg border-outline-variant bg-surface-container-low mb-4"/>
      <input type="hidden" id="rename-id"/>
      <div class="flex justify-end gap-2">
        <button type="button" id="rename-cancel" class="px-3 py-2 text-sm rounded-lg hover:bg-surface-container">Cancel</button>
        <button type="button" id="rename-save" class="px-3 py-2 text-sm bg-primary text-on-primary rounded-lg">Save</button>
      </div>
    </div>
  </div>
</template>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/media.js"></script>
<script>
  XplainLayout.init({ active: "media" });
  let activeFolder = null;

  function startUpload(fileOrName) {
    const box = document.getElementById("upload-progress");
    box.classList.remove("hidden");
    const name = typeof fileOrName === "string" ? fileOrName : fileOrName.name;
    document.getElementById("upload-name").textContent = name;
    XplainMedia.simulateUpload(fileOrName, {
      folder_id: activeFolder || "f-general",
      onProgress(pct, id, label) {
        document.getElementById("upload-pct").textContent = pct + "%";
        document.getElementById("upload-bar").style.width = pct + "%";
        document.getElementById("upload-label").textContent = label;
        render();
      },
      onDone(id, status) {
        XplainUI.toast(
          status === "indexed" ? "Indexed" : "Indexing failed",
          name,
          { icon: status === "indexed" ? "check_circle" : "error" }
        );
        render();
      },
    });
  }

  function render() {
    const media = XplainStore.getMedia();
    const folders = XplainStore.getFolders();
    const filter = document.getElementById("media-filter").value;
    const indexed = media.filter((m) => m.status === "indexed").length;
    const totalBytes = media.reduce((s, m) => s + (m.size_bytes || 0), 0);
    const quota = 10 * 1024 * 1024 * 1024;
    const pct = Math.min(100, Math.round((totalBytes / quota) * 1000) / 10) || 4;

    document.getElementById("stats-row").innerHTML = `
      <div class="bg-surface p-6 rounded-xl border border-outline-variant/30">
        <span class="material-symbols-outlined text-primary mb-4 text-3xl">database</span>
        <p class="text-xs uppercase text-on-surface-variant mb-1">Total Indexed</p>
        <p class="text-2xl font-semibold">${indexed} Docs</p>
      </div>
      <div class="bg-surface p-6 rounded-xl border border-outline-variant/30">
        <span class="material-symbols-outlined text-success mb-4 text-3xl">bolt</span>
        <p class="text-xs uppercase text-on-surface-variant mb-1">Processing Time</p>
        <p class="text-2xl font-semibold">~2.4s avg</p>
      </div>
      <div class="bg-surface p-6 rounded-xl border border-outline-variant/30">
        <span class="material-symbols-outlined text-on-surface-variant mb-4 text-3xl">storage</span>
        <p class="text-xs uppercase text-on-surface-variant mb-1">Storage Used</p>
        <p class="text-2xl font-semibold">${XplainUI.formatBytes(totalBytes)} <span class="text-base font-normal text-on-surface-variant">/ 10 GB</span></p>
        <div class="w-full bg-surface-variant h-1.5 rounded-full mt-2"><div class="bg-primary h-1.5 rounded-full" style="width:${Math.max(pct, 8)}%"></div></div>
      </div>`;

    document.getElementById("folder-grid").innerHTML = folders.map((f) => {
      const count = media.filter((m) => m.folder_id === f.id).length;
      const active = activeFolder === f.id;
      return `<button type="button" class="folder-btn group flex items-start gap-4 p-5 bg-surface rounded-xl border ${active ? "border-primary bg-surface-container-low" : "border-outline-variant"} hover:border-primary text-left" data-id="${f.id}">
        <span class="material-symbols-outlined text-primary text-4xl ${active ? "fill-icon" : ""}">folder</span>
        <div>
          <h3 class="font-semibold text-on-surface mb-1">${XplainUI.escapeHtml(f.name)}</h3>
          <p class="text-xs text-on-surface-variant">${count} items • Updated ${XplainUI.relativeTime(f.updated_at)}</p>
        </div>
      </button>`;
    }).join("");

    document.querySelectorAll(".folder-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFolder = activeFolder === btn.dataset.id ? null : btn.dataset.id;
        render();
      });
    });

    let list = media;
    if (activeFolder) list = list.filter((m) => m.folder_id === activeFolder);
    if (filter !== "all") list = list.filter((m) => m.status === filter);

    document.getElementById("media-list").innerHTML = list.map((m) => `
<div class="grid grid-cols-12 gap-4 p-4 items-center hover:bg-surface-container transition-colors group ${m.status === "failed" ? "opacity-70" : ""}">
  <div class="col-span-6 md:col-span-5 flex items-center gap-3 min-w-0">
    <div class="w-10 h-10 rounded ${m.mime_type?.includes("pdf") ? "bg-error-container text-on-error-container" : "bg-primary-container/50 text-primary"} flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined text-lg">${XplainUI.mediaIcon(m.mime_type)}</span>
    </div>
    <div class="min-w-0">
      <p class="font-medium text-on-surface truncate">${XplainUI.escapeHtml(m.display_name)}</p>
      <p class="text-xs text-on-surface-variant truncate md:hidden">${XplainUI.escapeHtml(m.uploaded_by)}</p>
    </div>
  </div>
  <div class="col-span-3 hidden md:block text-sm text-on-surface-variant truncate">${XplainUI.escapeHtml(m.uploaded_by)}</div>
  <div class="col-span-3 md:col-span-2 text-sm text-on-surface-variant">${XplainUI.formatBytes(m.size_bytes)}</div>
  <div class="col-span-3 md:col-span-2 flex items-center justify-between gap-1">
    ${XplainUI.statusChip(m.status)}
    <div class="hidden group-hover:flex items-center">
      ${m.status === "failed" ? `<button class="reindex-btn p-1.5 text-on-surface-variant hover:text-primary" data-id="${m.id}" title="Re-index"><span class="material-symbols-outlined text-sm">refresh</span></button>` : ""}
      <button class="rename-btn p-1.5 text-on-surface-variant hover:text-primary" data-id="${m.id}" title="Rename"><span class="material-symbols-outlined text-sm">edit</span></button>
      <button class="delete-btn p-1.5 text-on-surface-variant hover:text-error" data-id="${m.id}" title="Delete"><span class="material-symbols-outlined text-sm">delete</span></button>
    </div>
  </div>
</div>`).join("") || `<p class="p-8 text-center text-on-surface-variant text-sm">No resources in this view.</p>`;

    document.querySelectorAll(".rename-btn").forEach((b) =>
      b.addEventListener("click", () => {
        const m = XplainStore.getMediaItem(b.dataset.id);
        document.getElementById("rename-id").value = m.id;
        document.getElementById("rename-input").value = m.display_name;
        XplainUI.openModal("rename-modal");
      })
    );
    document.querySelectorAll(".delete-btn").forEach((b) =>
      b.addEventListener("click", () => {
        if (confirm("Delete this resource? (mock purge)")) {
          XplainStore.deleteMedia(b.dataset.id);
          render();
        }
      })
    );
    document.querySelectorAll(".reindex-btn").forEach((b) =>
      b.addEventListener("click", () => {
        XplainMedia.reindex(b.dataset.id);
        render();
        setTimeout(render, 1600);
      })
    );
  }

  document.getElementById("btn-upload").addEventListener("click", () => {
    document.getElementById("upload-progress").classList.add("hidden");
    XplainUI.openModal("upload-modal");
  });
  document.querySelectorAll("[data-close-upload]").forEach((b) =>
    b.addEventListener("click", () => XplainUI.closeModal("upload-modal"))
  );
  const drop = document.getElementById("drop-zone");
  const input = document.getElementById("file-input");
  drop.addEventListener("click", () => input.click());
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("border-primary"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("border-primary"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("border-primary");
    if (e.dataTransfer.files[0]) startUpload(e.dataTransfer.files[0]);
  });
  input.addEventListener("change", () => {
    if (input.files[0]) startUpload(input.files[0]);
  });
  document.getElementById("btn-fake-upload").addEventListener("click", () => {
    const n = document.getElementById("fake-name").value.trim();
    if (n) startUpload(n);
  });
  document.getElementById("media-filter").addEventListener("change", render);
  document.getElementById("rename-cancel").addEventListener("click", () => XplainUI.closeModal("rename-modal"));
  document.getElementById("rename-save").addEventListener("click", () => {
    const id = document.getElementById("rename-id").value;
    const name = document.getElementById("rename-input").value.trim();
    if (name) XplainStore.updateMedia(id, { display_name: name });
    XplainUI.closeModal("rename-modal");
    render();
  });

  // Auto-advance seed processing item
  const processing = XplainStore.getMedia().find((m) => m.id === "m-history" && m.status === "processing");
  if (processing) {
    setTimeout(() => {
      XplainStore.updateMedia("m-history", { status: "indexed" });
      render();
    }, 4000);
  }

  render();
  window.addEventListener("xplain:store", render);
</script>
</body>
</html>
