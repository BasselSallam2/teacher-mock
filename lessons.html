<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lesson Sessions - Xplain AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app-shell"></div>
<template id="page-template">
  <main class="flex-1 p-4 md:p-16 overflow-y-auto">
    <div class="max-w-5xl mx-auto space-y-6">
      <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <h1 class="text-3xl font-semibold text-on-surface">Lesson Sessions</h1>
          <p class="text-on-surface-variant mt-1">Plans in progress and built lessons for your classes.</p>
        </div>
        <a href="workspace.html?new=1" class="inline-flex items-center gap-2 px-4 py-2.5 bg-primary-container text-on-primary-container rounded-lg text-sm">
          <span class="material-symbols-outlined text-sm">add</span> New Lesson
        </a>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-full text-sm bg-primary-container text-on-primary-container">All</button>
        <button data-filter="planning" class="filter-btn px-3 py-1.5 rounded-full text-sm bg-surface-container text-on-surface-variant">Planning</button>
        <button data-filter="building" class="filter-btn px-3 py-1.5 rounded-full text-sm bg-surface-container text-on-surface-variant">Building</button>
        <button data-filter="ready" class="filter-btn px-3 py-1.5 rounded-full text-sm bg-surface-container text-on-surface-variant">Ready</button>
        <button data-filter="failed" class="filter-btn px-3 py-1.5 rounded-full text-sm bg-surface-container text-on-surface-variant">Failed</button>
      </div>
      <div id="session-list" class="space-y-3"></div>
    </div>
  </main>
</template>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script>
  XplainLayout.init({ active: "lessons", title: "Lesson Sessions" });
  let filter = "all";

  function items() {
    const sessions = XplainStore.getSessions().map((s) => ({
      kind: "session",
      id: s.id,
      title: s.title,
      status: s.phase === "ready" ? "ready" : s.phase === "building" ? "building" : "planning",
      class_id: s.class_id,
      updated_at: s.updated_at,
      href: `workspace.html?id=${s.id}`,
    }));
    const lessons = XplainStore.getLessons()
      .filter((l) => !l.session_id || !sessions.find((s) => s.id === l.session_id))
      .map((l) => ({
        kind: "lesson",
        id: l.id,
        title: l.title,
        status: l.status,
        class_id: l.class_id,
        updated_at: l.updated_at,
        href: l.status === "ready" ? `workspace.html?lesson=${l.id}` : "lessons.html",
        meta: l.build_progress?.label || l.error,
        icon: l.icon,
      }));
    return [...sessions, ...lessons].sort(
      (a, b) => new Date(b.updated_at) - new Date(a.updated_at)
    );
  }

  function render() {
    let list = items();
    if (filter !== "all") list = list.filter((i) => i.status === filter);
    document.getElementById("session-list").innerHTML = list.map((i) => {
      const cls = XplainStore.getClass(i.class_id);
      return `
<a href="${i.href}" class="flex items-center justify-between gap-4 bg-surface border border-outline-variant/60 rounded-xl p-5 hover:bg-surface-container-low transition-colors">
  <div class="flex items-center gap-4 min-w-0">
    <div class="w-12 h-12 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined">${i.icon || "menu_book"}</span>
    </div>
    <div class="min-w-0">
      <h4 class="font-semibold text-on-surface truncate">${XplainUI.escapeHtml(i.title)}</h4>
      <p class="text-sm text-on-surface-variant truncate">${XplainUI.escapeHtml(cls?.name || "")} • ${i.meta || XplainUI.relativeTime(i.updated_at)}</p>
    </div>
  </div>
  ${XplainUI.statusChip(i.status)}
</a>`;
    }).join("") || `<div class="text-center py-16 text-on-surface-variant">
      <p class="mb-4">No lesson sessions yet.</p>
      <a href="workspace.html?new=1" class="text-primary underline">Start your first lesson</a>
    </div>`;
  }

  document.querySelectorAll(".filter-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      document.querySelectorAll(".filter-btn").forEach((b) => {
        b.className = "filter-btn px-3 py-1.5 rounded-full text-sm bg-surface-container text-on-surface-variant";
      });
      btn.className = "filter-btn px-3 py-1.5 rounded-full text-sm bg-primary-container text-on-primary-container";
      render();
    });
  });
  render();
  window.addEventListener("xplain:store", render);
</script>
</body>
</html>
