<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings - Xplain AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app-shell"></div>
<template id="page-template">
  <main class="flex-1 p-4 md:p-16 overflow-y-auto">
    <div class="max-w-xl mx-auto space-y-8">
      <div>
        <h1 class="text-3xl font-semibold text-on-surface">Settings</h1>
        <p class="text-on-surface-variant mt-2">Your personal profile for this workspace.</p>
      </div>

      <section class="bg-surface border border-outline-variant rounded-xl p-6">
        <p class="text-xs uppercase tracking-wider text-on-surface-variant mb-2">Organization</p>
        <div class="flex items-center gap-3">
          <div id="org-logo" class="w-12 h-12 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center overflow-hidden shrink-0">
            <span class="material-symbols-outlined">school</span>
          </div>
          <div class="min-w-0">
            <p class="font-semibold text-on-surface" id="org-name-label">—</p>
            <p class="text-sm text-on-surface-variant" id="org-role-label"></p>
          </div>
        </div>
        <p id="org-admin-hint" class="hidden text-sm text-on-surface-variant mt-3">
          Edit name, logo, and domains in
          <a href="organization.html" class="text-primary hover:underline">Organization</a>.
        </p>
      </section>

      <form id="settings-form" class="bg-surface border border-outline-variant rounded-xl p-6 space-y-5">
        <div>
          <label class="text-sm text-on-surface-variant">Display name</label>
          <input id="display_name" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low" required/>
        </div>
        <div>
          <label class="text-sm text-on-surface-variant">Locale</label>
          <select id="locale" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low">
            <option value="en">English</option>
            <option value="ar">Arabic (RTL — display only in mock)</option>
          </select>
        </div>
        <div class="flex flex-wrap gap-3 pt-2">
          <button type="submit" class="px-5 py-2.5 bg-primary text-on-primary rounded-lg text-sm">Save settings</button>
          <button type="button" id="btn-reset" class="px-5 py-2.5 border border-outline-variant rounded-lg text-sm text-on-surface-variant">Reset demo data</button>
        </div>
      </form>
      <p class="text-xs text-on-surface-variant">Email: <span id="email-label"></span> · Mock account (no WorkOS)</p>
    </div>
  </main>
</template>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script>
  XplainLayout.init({ active: "settings", title: "Settings" });

  function fill() {
    const t = XplainStore.getTeacher();
    const org = XplainStore.getCurrentOrganization();
    const user = XplainStore.getCurrentUser();
    document.getElementById("display_name").value = t.display_name || "";
    document.getElementById("locale").value = t.locale || "en";
    document.getElementById("email-label").textContent = t.email;
    document.getElementById("org-name-label").textContent = org?.name || t.school_name || "—";
    document.getElementById("org-role-label").textContent =
      user?.role === "org_admin" ? "Organization admin" : "Teacher";
    if (user?.role === "org_admin") {
      document.getElementById("org-admin-hint").classList.remove("hidden");
    }
    if (org?.logo_data_url || t.logo_data_url) {
      document.getElementById("org-logo").innerHTML =
        `<img src="${org?.logo_data_url || t.logo_data_url}" class="w-full h-full object-cover" alt=""/>`;
    }
  }

  document.getElementById("settings-form").addEventListener("submit", (e) => {
    e.preventDefault();
    XplainStore.updateTeacher({
      display_name: document.getElementById("display_name").value,
      locale: document.getElementById("locale").value,
    });
    XplainUI.toast("Settings saved", "", { icon: "check" });
    location.reload();
  });

  document.getElementById("btn-reset").addEventListener("click", async () => {
    const ok = await XplainUI.confirmDialog({
      title: "Reset demo data?",
      message: "All mock data will be restored to the seed. You will be logged out.",
      confirmLabel: "Reset",
      cancelLabel: "Cancel",
      danger: true,
    });
    if (!ok) return;
    XplainStore.reset();
    location.href = "login.html";
  });

  fill();
</script>
</body>
</html>
