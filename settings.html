<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings - Xplain AI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app-shell"></div>
<template id="page-template">
  <main class="flex-1 p-4 md:p-16 overflow-y-auto">
    <div class="max-w-xl mx-auto space-y-8">
      <div>
        <h1 class="text-3xl font-semibold text-on-surface">School Settings</h1>
        <p class="text-on-surface-variant mt-2">Branding appears on every lesson export (mock).</p>
      </div>
      <form id="settings-form" class="bg-surface border border-outline-variant rounded-xl p-6 space-y-5">
        <div>
          <label class="text-sm text-on-surface-variant">School name</label>
          <input id="school_name" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low" required/>
        </div>
        <div>
          <label class="text-sm text-on-surface-variant">Teacher display name</label>
          <input id="display_name" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low" required/>
        </div>
        <div>
          <label class="text-sm text-on-surface-variant">Locale</label>
          <select id="locale" class="mt-1 w-full rounded-lg border-outline-variant bg-surface-container-low">
            <option value="en">English</option>
            <option value="ar">Arabic (RTL — display only in mock)</option>
          </select>
        </div>
        <div>
          <label class="text-sm text-on-surface-variant">School logo</label>
          <div class="mt-2 flex items-center gap-4">
            <div id="logo-preview" class="w-16 h-16 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center overflow-hidden">
              <span class="material-symbols-outlined">school</span>
            </div>
            <div>
              <input type="file" id="logo-input" accept="image/*" class="text-sm"/>
              <p class="text-xs text-on-surface-variant mt-1">Stored as data URL in localStorage (mock).</p>
            </div>
          </div>
        </div>
        <div class="flex flex-wrap gap-3 pt-2">
          <button type="submit" class="px-5 py-2.5 bg-primary text-on-primary rounded-lg text-sm">Save settings</button>
          <button type="button" id="btn-reset" class="px-5 py-2.5 border border-outline-variant rounded-lg text-sm text-on-surface-variant">Reset demo data</button>
        </div>
      </form>
      <p class="text-xs text-on-surface-variant">Email: <span id="email-label"></span> · Mock account (no WorkOS)</p>
    </div>
  </main>
</template>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script>
  XplainLayout.init({ active: "settings", title: "Settings" });

  function fill() {
    const t = XplainStore.getTeacher();
    document.getElementById("school_name").value = t.school_name || "";
    document.getElementById("display_name").value = t.display_name || "";
    document.getElementById("locale").value = t.locale || "en";
    document.getElementById("email-label").textContent = t.email;
    const prev = document.getElementById("logo-preview");
    if (t.logo_data_url) {
      prev.innerHTML = `<img src="${t.logo_data_url}" class="w-full h-full object-cover" alt=""/>`;
    }
  }

  document.getElementById("logo-input").addEventListener("change", (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      document.getElementById("logo-preview").innerHTML =
        `<img src="${reader.result}" class="w-full h-full object-cover" alt=""/>`;
      document.getElementById("logo-preview").dataset.url = reader.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("settings-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const logo = document.getElementById("logo-preview").dataset.url;
    XplainStore.updateTeacher({
      school_name: document.getElementById("school_name").value,
      display_name: document.getElementById("display_name").value,
      locale: document.getElementById("locale").value,
      ...(logo ? { logo_data_url: logo } : {}),
    });
    XplainUI.toast("Settings saved", "Branding will show on exports.", { icon: "check" });
    // refresh sidebar branding
    location.reload();
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    if (confirm("Reset all mock data to seed?")) {
      XplainStore.reset();
      XplainUI.toast("Demo reset", "", { icon: "restart_alt" });
      location.reload();
    }
  });

  fill();
</script>
</body>
</html>
